name: usb_gadget
description: Expose standard or fully custom USB peripherals (gadgets) through a USB device controller (UDC) on Linux.
version: 1.0.1
homepage: https://github.com/GuillaumeMCK/usb-gadget

platforms:
  linux:
  android:

environment:
  sdk: ^3.11.0

dependencies:
  ffi: ^2.1.5
  meta: ^1.17.0
  using: ^1.0.5

dev_dependencies:
  ffigen: ^20.1.1
  leancode_lint: ^22.0.0
  lints: ^6.1.0
  test: ^1.25.0

scripts:
  gen:
    find lib/src/platform -name "ffigen_*.yaml" | xargs -I {} dart run ffigen --config {}