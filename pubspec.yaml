name: usb_gadget
description: Implement USB gadgets for UDC-capable Linux systems — Kernel Functions and FunctionFS
version: 1.0.2
homepage: https://github.com/GuillaumeMCK/usb-gadget

platforms:
  linux:

environment:
  sdk: ^3.10.0

dependencies:
  ffi: ^2.1.5
  meta: ^1.17.0
  using: ^1.0.5

dev_dependencies:
  ffigen: ^20.1.1
  leancode_lint: ^22.0.0
  lints: ^6.1.0
  test: ^1.25.0

scripts:
  gen:
    find lib/src/platform -name "ffigen_*.yaml" | xargs -I {} dart run ffigen --config {}